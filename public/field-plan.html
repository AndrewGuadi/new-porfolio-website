<style>
:root{--paper:#f6f3e9;--ink:#202e28;--pine:#244c3d;--red:#a84132;--line:#c6c4b7;--light:#fffdf5;--muted:#525c50;color-scheme:light;font:15px/1.45 "Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}.shell{max-width:1390px;margin:auto;padding:0 clamp(15px,4vw,56px) 22px}button,input,select{font:inherit;color:inherit}button,select{cursor:pointer}button{background:var(--light);border:1px solid var(--line);padding:.55em .85em;border-radius:4px;font-weight:650}button:hover{background:#e9ebdb;border-color:#718372}button:disabled{opacity:.44;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #c55730;outline-offset:2px}button.primary{background:var(--pine);color:white;border-color:var(--pine)}button.primary:hover{background:#133a2c}header{min-height:66px;border-bottom:1px solid var(--ink);display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-family:Georgia,serif;font-style:italic;font-size:1.55rem;letter-spacing:-.09em;display:flex;align-items:center;gap:10px}.mark{width:30px;height:30px}.mono,.eyebrow,.coord{font-family:ui-monospace,"Courier New",monospace;font-size:.71rem;font-weight:650;letter-spacing:.105em;text-transform:uppercase}.save-state{color:var(--pine);text-align:right;font-size:.76rem}.hero{display:flex;gap:1rem;align-items:flex-end;justify-content:space-between;padding:clamp(20px,3.4vw,50px) 0 20px}.hero h1{font:normal clamp(43px,6vw,82px)/.98 Georgia,serif;letter-spacing:-.07em;margin:6px 0}.eyebrow{color:var(--red)}.actions{display:flex;gap:6px;align-items:center}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 304px;gap:20px;align-items:start}.map-card,.editor{border:1px solid var(--line);border-top:3px solid var(--ink);background:var(--light)}.map-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:12px 15px}.map-bar strong{display:block;overflow-wrap:anywhere;font-size:1.12rem}.coord{white-space:nowrap}.map-wrap{background:#e5e6d7;position:relative}.map-wrap svg{display:block;width:100%;height:auto;touch-action:manipulation}.map-hint{padding:10px 14px;font-size:.83rem;min-height:40px;color:#303e34;border-top:1px solid var(--line);background:#f0efdf}.legend-section{padding:13px 15px 16px;border-top:1px solid var(--line)}h2{font-family:Georgia,serif;font-size:1.38rem;letter-spacing:-.036em;line-height:1.15;margin:0 0 12px}.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:6px 10px}.legend button{text-align:left;display:flex;align-items:center;gap:8px;font-size:.8rem;padding:4px;border:0;background:transparent;overflow-wrap:anywhere;line-height:1.2}.legend button:hover{background:#e9ebdb}.swatch{font:650 .7rem/22px ui-monospace,monospace;color:white;text-align:center;min-width:24px;border-radius:3px}.editor{padding:16px}.block+.block{border-top:1px solid var(--line);margin-top:17px;padding-top:15px}label{display:block;font-size:.8rem;margin-bottom:4px;font-weight:bold}input,select{background:#fffdf6;border:1px solid #969b89;border-radius:3px;width:100%;padding:7px 9px;min-width:0}.palette{display:grid;grid-template-columns:1fr 1fr;gap:5px}.palette button{display:flex;align-items:center;gap:7px;text-align:left;font-size:.83rem;padding:7px 8px}.palette button[aria-pressed=true],.legend button[aria-pressed=true]{background:#dce4d4;outline:1px solid var(--pine)}.dot{width:11px;height:11px;border-radius:2px;flex:none}.small{font-size:.8rem;color:var(--muted);margin:4px 0 8px}.row{display:flex;gap:6px;margin-top:7px;align-items:center;flex-wrap:wrap}.row button{font-size:.82rem}.mode-panel{background:#eaedde;padding:11px;margin-top:10px;border-left:3px solid var(--pine)}.mode-panel:empty{display:none}.mode-panel label{margin-top:6px}.mode-panel h3{margin:0 0 7px;font-size:1rem}.mode-panel p{margin:5px 0}.minor{color:var(--red)}.inline{font-size:.8rem}footer{margin-top:15px;font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.cell{cursor:pointer}.cell .gridcell{stroke:#a9b09b;stroke-width:.8;fill:#f5f2df;fill-opacity:.46}.cell:hover .gridcell{fill:#b1c6a5;fill-opacity:.75}.cell:focus{outline:none}.cell:focus-visible .gridcell{stroke:#131b15;stroke-width:3}.cell.selected .gridcell{stroke:#ad4c2e;stroke-width:3}.asset{pointer-events:none}.asset text{font-family:Arial,sans-serif}.editor button,summary{touch-action:manipulation}details summary{cursor:pointer;font-weight:650}details label{margin-top:10px}.hidden{display:none!important}
@media(max-width:800px){.workspace{grid-template-columns:1fr;gap:12px}.editor{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}.block+.block{margin:0;padding:0;border:0}.block:last-child{align-self:start}.shell{padding:0 12px 16px}.hero{align-items:start;gap:9px;flex-direction:column}.map-bar{padding:8px 11px}.map-hint{padding:7px 10px}.hero h1{margin:2px 0}.map-wrap{overflow-x:auto}.map-wrap svg{min-width:340px}.legend-section{padding:10px}.legend{grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:3px}.editor{padding:12px}.mode-panel{margin:6px 0 0}header{min-height:50px}.hero{padding:14px 0}.actions button{font-size:.83rem}}
@media(max-width:560px){.editor{display:block}.block+.block{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}.map-bar strong{font-size:1rem}.hero{flex-direction:row;align-items:flex-end}.actions{flex-direction:column;align-items:stretch}.actions button{padding:5px 8px}.palette{grid-template-columns:repeat(3,1fr)}.legend button{min-height:31px}.hero h1{font-size:46px}.coord{font-size:.64rem}.palette button{min-height:40px}}

<body><nav class="project-return" aria-label="Project navigation"><a href="project-room.html">The Project Room</a><span> / </span><a href="./">Andrew Guasch</a></nav><div class="shell"><header><div class="brand"><svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="none" stroke="#244c3d"/><path d="M27 6 22 24 12 32 17 15Z" fill="#244c3d"/><path d="m27 6-8 13-7 13 10-8z" fill="#b9563e"/></svg>Field Plan</div><span id="storage" class="save-state"></span></header>
<main><div class="hero"><div><div class="eyebrow">Community event planning</div><h1>Draw the grounds.</h1></div><div class="actions"><button id="export" class="primary">Export SVG ↓</button><button id="print">Print map</button></div></div>
<div class="workspace"><section class="map-card" aria-label="Interactive site map"><div class="map-bar"><strong id="displayTitle"></strong><span class="coord">A–H / 1–6</span></div><div class="map-wrap"><svg id="map" role="group" aria-label="Editable eight-column site map. Use arrow keys to navigate plots and Enter to select." viewBox="0 0 790 565"></svg></div><div id="hint" class="map-hint" role="status"></div><div class="legend-section"><h2>Map key</h2><div id="legend" class="legend"></div></div></section>
<aside class="editor" aria-label="Map controls"><section class="block"><h2>Place on map</h2><div class="palette" id="palette"></div><div id="inspect" class="mode-panel"></div></section><section class="block"><h2>Find a spot</h2><label for="priority">Layout priority</label><select id="priority"><option value="welcome">Visitor arrival</option><option value="food">Food court</option><option value="show">Stage area</option></select><div class="row"><button id="suggest">Suggest a placement</button></div><div id="suggestion" aria-live="polite"></div></section><section class="block"><details><summary>Plan settings</summary><label for="name">Event name</label><input id="name" maxlength="65" autocomplete="off"><div class="row"><button id="undo" disabled>Undo last edit</button></div></details></section></aside></div></main>

<script>
'use strict';
const $=id=>document.getElementById(id);
const types={
entry:{label:'Entrance',color:'#3d6551',path:'M4 21V6h16v15 M8 21V10h8v11 M3 6l9-4 9 4'},
booth:{label:'Booth',color:'#7a523c',path:'M2 10l3-6h14l3 6 M3 10h18 M5 11v9h14v-9 M4 16h16 M8 4l-1 6 M15 4l2 6'},
truck:{label:'Food truck',color:'#a34934',path:'M2 6h13v10H2z M15 10h4l3 4v3h-7 M6 17a2 2 0 1 0 .1 0 M18 17a2 2 0 1 0 .1 0 M5 9h7'},
stage:{label:'Stage',color:'#534c72',path:'M3 19h18 M5 17V5h14v12 M4 5h16 M6 7l3 4-3 4 M18 7l-3 4 3 4 M10 16h4'},
wc:{label:'Restrooms',color:'#356672',path:'M12 3v18 M4 10h5 M5 9v6h3V9 M6.5 4a1.4 1.4 0 1 0 .1 0 M6.5 15v5 M15 14l2-5h2l2 5z M17 15v5 M19 15v5 M18 4a1.4 1.4 0 1 0 .1 0'},
table:{label:'Seating',color:'#6b682f',path:'M5 10h14 M7 10l-3 10 M17 10l3 10 M2 16h6 M16 16h6 M8 14h8 M6 7h12'}
};
const key='andrew-field-plan-v1', cols=8, rows=6, letters='ABCDEFGH';
const initial={name:'Susquehanna Saturday Market',next:8,items:[
{id:1,type:'entry',x:0,y:5,name:'Market gate'},{id:2,type:'booth',x:2,y:2,name:'Pottery booth'},{id:3,type:'booth',x:2,y:3,name:'Farm stand'},{id:4,type:'truck',x:5,y:1,name:'Kitchen truck'},{id:5,type:'stage',x:6,y:4,name:'Acoustic stage'},{id:6,type:'wc',x:0,y:3,name:'Restrooms'},{id:7,type:'table',x:5,y:2,name:'Picnic tables'}]};
const clone=obj=>JSON.parse(JSON.stringify(obj));
function valid(data){return data&&typeof data.name==='string'&&data.name.trim()&&Number.isSafeInteger(data.next)&&data.next>0&&Array.isArray(data.items)&&data.items.length<=48&&data.items.every(p=>p&&Object.hasOwn(types,p.type)&&typeof p.name==='string'&&p.name.length<=48&&Number.isInteger(p.x)&&p.x>=0&&p.x<cols&&Number.isInteger(p.y)&&p.y>=0&&p.y<rows&&Number.isSafeInteger(p.id)&&p.id>0&&p.id<data.next)&&new Set(data.items.map(p=>p.x+','+p.y)).size===data.items.length&&new Set(data.items.map(p=>p.id)).size===data.items.length}
let model=clone(initial),stored=false;try{const v=JSON.parse(localStorage.getItem(key));if(valid(v)){model=v;stored=true}}catch{}
let selected=null,placing='',moving=false,spot=null,focus={x:0,y:0},previous=[],message='Pick a map marker to edit, or choose a place to add.';
function esc(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]))}
function coord(x,y){return letters[x]+(y+1)}
function at(x,y){return model.items.find(p=>p.x===x&&p.y===y)}
function active(){return model.items.find(p=>p.id===selected)}
function save(){try{localStorage.setItem(key,JSON.stringify(model));$('storage').textContent='Saved on this device'}catch{$('storage').textContent='Local saving unavailable · Export SVG'}}
function before(){previous.push(clone(model));if(previous.length>20)previous.shift()}
function endMode(){placing='';moving=false;spot=null}
function record(done){before();done();save();render()}
function art(){
let paths='';for(let i=0;i<9;i++){paths+='<path d="M-75 '+(100-i*10)+' Q 60 '+(30-i*8)+' 119 '+(37-i*8)+' T 325 '+(-15-i*7)+' M 584 '+(590+i*7)+' Q 630 '+(501+i*8)+' 720 '+(516+i*5)+' T 837 '+(470+i*7)+'" />'}
return '<rect width="790" height="565" fill="#e7e8d6"/><g fill="none" stroke="#c2c9ac" stroke-width="1.5">'+paths+'</g><g font-family="monospace" fill="#586153" font-size="13" text-anchor="middle">'+[...letters].map((c,i)=>'<text x="'+(91+i*88)+'" y="30">'+c+'</text>').join('')+Array.from({length:6},(_,i)=>'<text x="27" y="'+(82+i*80)+'">'+(i+1)+'</text>').join('')+'</g><path d="M746 525l7-19 7 19-7-5z" fill="#364d40"/><text x="753" y="503" text-anchor="middle" font-family="monospace" font-size="12" fill="#33483b">N</text><path d="M47 539h70m-70-4v8m35-8v8m35-8v8" fill="none" stroke="#617056" stroke-width="2"/><text x="129" y="543" fill="#43553e" font-family="monospace" font-size="11">PLOT INDEX</text>'}
function mapMarkup(live){let result=art();for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const p=at(x,y),t=p&&types[p.type],suggested=spot&&spot.x===x&&spot.y===y;const a=47+88*x,b=38+80*y;
let attrs=live?'class="cell'+(p&&p.id===selected?' selected':'')+'" data-x="'+x+'" data-y="'+y+'" tabindex="'+(focus.x===x&&focus.y===y?'0':'-1')+'" role="button" aria-label="'+esc(coord(x,y)+(p?', '+p.name+', '+t.label:', empty plot'))+'"':'';
result+='<g transform="translate('+a+' '+b+')" '+attrs+'><rect class="gridcell" x="1" y="1" width="86" height="78" rx="3" fill="#f5f2df" fill-opacity=".46" stroke="#a9b09b" stroke-width=".8"/>';
if(p){result+='<g class="asset"><rect x="12" y="8" width="62" height="49" rx="4" fill="'+t.color+'"/><path d="'+t.path+'" transform="translate(27 14) scale(1.4)" fill="none" stroke="#fff9e8" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="71" font-size="13" text-anchor="middle" fill="#26382c" font-family="monospace" font-weight="bold">'+coord(x,y)+'</text></g>'}else if(suggested&&live){result+='<rect x="4" y="4" width="80" height="72" fill="#d7e5c7" stroke="#365943" stroke-dasharray="5 3"/><path d="M36 40h16m-8-8v16" stroke="#365943" stroke-width="3"/>'}result+='</g>'}return result}
function palette(){return Object.entries(types).map(([k,t])=>'<button data-type="'+k+'" aria-pressed="'+(placing===k)+'"><span class="dot" style="background:'+t.color+'"></span>'+t.label+'</button>').join('')}
function render(){const p=active();$('map').innerHTML=mapMarkup(true);$('displayTitle').textContent=model.name;$('name').value=model.name;$('hint').textContent=message;$('palette').innerHTML=palette();$('undo').disabled=!previous.length;
$('legend').innerHTML=model.items.length?model.items.map(p=>'<button data-item="'+p.id+'" aria-pressed="'+(selected===p.id)+'"><span class="swatch" style="background:'+types[p.type].color+'">'+coord(p.x,p.y)+'</span>'+esc(p.name)+'</button>').join(''):'No places on this map yet.';
$('inspect').innerHTML=placing?'<h3>Place '+types[placing].label.toLowerCase()+'</h3><p class="small">Choose an empty map square.</p><button id="cancel">Cancel</button>':p?'<h3>'+types[p.type].label+' · '+coord(p.x,p.y)+'</h3><label for="itemName">Map label</label><input id="itemName" maxlength="48" value="'+esc(p.name)+'"><div class="row"><button id="rename">Save label</button><button id="move" aria-pressed="'+moving+'">'+(moving?'Cancel move':'Move')+'</button><button id="remove" class="minor">Remove</button></div>':'';
$('suggestion').innerHTML=spot?'<div class="mode-panel"><strong>'+types[spot.type].label+' · '+coord(spot.x,spot.y)+'</strong><p class="small">'+esc(spot.reason)+'</p><button id="useSpot">Place here</button></div>':''}
function focusCell(){const el=$('map').querySelector('[data-x="'+focus.x+'"][data-y="'+focus.y+'"]');if(el)el.focus({preventScroll:true})}
function add(type,x,y){if(at(x,y))return;record(()=>{const id=model.next++;model.items.push({id,type,x,y,name:types[type].label});selected=id;endMode();focus={x,y};message=types[type].label+' added to '+coord(x,y)+'. Edit its map label below.'})}
function mark(x,y){focus={x,y};const p=at(x,y);
if(placing||moving){if(p){message='That plot already has '+p.name+'. Choose an empty square.';render();return}if(placing){add(placing,x,y);return}const current=active();if(current){record(()=>{current.x=x;current.y=y;endMode();message=current.name+' moved to '+coord(x,y)+'.'})}return}
selected=p?p.id:null;message=p?p.name+' selected at '+coord(x,y)+'. Use the map controls to rename, move or remove it.':'Empty plot '+coord(x,y)+'. Choose a place type, then tap a plot.';render()}
$('map').addEventListener('click',e=>{const cell=e.target.closest('[data-x]');if(cell)mark(+cell.dataset.x,+cell.dataset.y)});
$('map').addEventListener('keydown',e=>{const cell=e.target.closest('[data-x]');if(!cell)return;const x=+cell.dataset.x,y=+cell.dataset.y;const shifts={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};if(shifts[e.key]){e.preventDefault();const [dx,dy]=shifts[e.key];focus={x:Math.max(0,Math.min(cols-1,x+dx)),y:Math.max(0,Math.min(rows-1,y+dy))};render();focusCell()}else if([' ','Enter'].includes(e.key)){e.preventDefault();mark(x,y);focusCell()}else if(e.key==='Escape'){endMode();message='Placement cancelled.';render();focusCell()}});
function goMap(){focusCell();$('map').scrollIntoView({block:'nearest'})}
$('palette').onclick=e=>{const b=e.target.closest('[data-type]');if(!b)return;const t=b.dataset.type;endMode();selected=null;placing=t;message='Choose an empty square for the '+types[t].label.toLowerCase()+'.';render();goMap()};
$('legend').onclick=e=>{const b=e.target.closest('[data-item]');if(!b)return;endMode();const p=model.items.find(i=>i.id===+b.dataset.item);mark(p.x,p.y);const field=$('itemName');if(field)field.focus()};
function rename(){const p=active(),name=$('itemName').value.trim();if(!p||!name){if($('itemName'))$('itemName').value=p?p.name:'';return}if(name!==p.name){record(()=>{p.name=name;message='Map label saved.'});$('itemName').focus()}}
$('inspect').onclick=e=>{const p=active();switch(e.target.id){case 'cancel':endMode();message='Placement cancelled.';render();break;case 'move':moving=!moving;spot=null;message=moving?'Choose an empty plot for '+p.name+'.':'Move cancelled.';render();if(moving)goMap();break;case 'rename':rename();break;case 'remove':record(()=>{model.items=model.items.filter(i=>i.id!==selected);selected=null;endMode();message=p.name+' removed. Use Undo last edit in Plan settings to restore it.'});break}};
$('inspect').onkeydown=e=>{if(e.key==='Enter'&&e.target.id==='itemName'){e.preventDefault();rename()}};
$('name').onchange=()=>{const n=$('name').value.trim();if(n&&n!==model.name)record(()=>{model.name=n;message='Event name updated.'});else $('name').value=model.name};
$('undo').onclick=()=>{if(!previous.length)return;model=previous.pop();selected=null;endMode();message='Last edit undone.';save();render()};
function suggestion(){
const goal=$('priority').value,profile={welcome:['entry','booth'],food:['truck','table'],show:['stage','table']}[goal];const anchors=model.items.filter(p=>p.type===profile[0]);const type=anchors.length?profile[1]:profile[0];const candidates=[];
for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){if(at(x,y))continue;const edge=Math.min(x,y,cols-1-x,rows-1-y);const dist=(p)=>Math.abs(p.x-x)+Math.abs(p.y-y);const near=anchors.length?anchors.reduce((a,b)=>dist(a)<=dist(b)?a:b):null;const open=[[1,0],[-1,0],[0,1],[0,-1]].filter(([a,b])=>x+a>=0&&x+a<cols&&y+b>=0&&y+b<rows&&!at(x+a,y+b)).length;const same=model.items.filter(p=>p.type===type);const spread=same.length?Math.min(...same.map(dist)):0;
const score=near?50-Math.abs(dist(near)-(goal==='show'?2:1))*10+open*.7+Math.min(3,spread)*.65:(goal==='welcome'?25-edge*8:15-Math.abs(edge-1)*4)+open-Math.abs(x-(goal==='welcome'?0:5))*.4;
candidates.push({x,y,type,score,reason:near?(goal==='welcome'?'A booth near ':goal==='food'?'Seat visitors near ':'Give listeners a place near ')+near.name+' ('+coord(near.x,near.y)+').':goal==='welcome'?'Start with an entrance at the edge of the grounds.':goal==='food'?'Place the first food truck to start a dining area.':'Place the first stage to anchor the performance area.'})}
return candidates.sort((a,b)=>b.score-a.score)[0]}
$('suggest').onclick=()=>{endMode();selected=null;spot=suggestion();message=spot?'Suggested '+types[spot.type].label.toLowerCase()+' at '+coord(spot.x,spot.y)+'. Choose Place here to add it.':'All plots are occupied. Remove a place before adding another.';render()};$('priority').onchange=()=>{spot=null;render()};$('suggestion').onclick=e=>{if(e.target.id==='useSpot'&&spot)add(spot.type,spot.x,spot.y)};
function exportSvg(){const keyrows=Math.ceil(model.items.length/2),height=706+keyrows*48;let legend='';model.items.forEach((p,i)=>{const x=35+(i%2)*390,y=684+Math.floor(i/2)*48;const t=types[p.type],name=esc(p.name),size=p.name.length>34?11:p.name.length>23?13:16;legend+='<rect x="'+x+'" y="'+(y-18)+'" width="38" height="24" rx="3" fill="'+t.color+'"/><text x="'+(x+19)+'" y="'+y+'" font-size="15" text-anchor="middle" fill="white">'+coord(p.x,p.y)+'</text><text x="'+(x+48)+'" y="'+y+'" font-size="'+size+'" fill="#20362a">'+name+'</text><text x="'+(x+48)+'" y="'+(y+16)+'" font-size="11" fill="#526153">'+t.label+'</text>'});
